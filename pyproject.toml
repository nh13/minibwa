# Tooling config for the distribution machinery under minibwa_dist/.
# minibwa itself is C; nothing here affects the aligner build.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"minibwa_dist/tests/*" = ["ANN201"]

[tool.pytest.ini_options]
testpaths = ["minibwa_dist/tests"]
